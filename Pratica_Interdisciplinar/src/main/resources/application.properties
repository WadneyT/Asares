spring.application.name=Pratica_Interdisciplinar
# =========================================
# Perfil padrao: desenvolvimento com H2
# Para rodar com PostgreSQL: --spring.profiles.active=postgres
# =========================================

spring.application.name=financas

# --- Banco de dados H2 (em memoria) ---
spring.datasource.url=jdbc:h2:mem:financasdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# --- JWT ---
# Em producao, mover para variavel de ambiente (nunca deixar hardcoded)
app.jwt.secret=troque-esta-chave-por-uma-bem-longa-e-secreta-em-producao-0123456789
app.jwt.expiration-ms=86400000

