# =========================================
# Perfil de producao/homologacao com PostgreSQL
# Ativar com: --spring.profiles.active=postgres
# =========================================

spring.datasource.url=jdbc:postgresql://localhost:5432/financasdb
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.h2.console.enabled=false

app.jwt.secret=${JWT_SECRET:troque-esta-chave-por-uma-bem-longa-e-secreta-em-producao-0123456789}
app.jwt.expiration-ms=86400000
